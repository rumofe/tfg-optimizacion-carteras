name: Keep backend awake

# Render's free tier spins the service down after 15 min of inactivity, which
# causes a ~50s cold start on the next request. This workflow pings the API
# every 12 minutes so the demo stays warm for recruiters.
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl -sSf https://portfoliolab-api.onrender.com/docs > /dev/null || true
